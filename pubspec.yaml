name: period_calendar
description: "A warm, private period & cycle calendar."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.27
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  table_calendar: ^3.1.2
  fl_chart: ^0.69.2

  # Platform integrations
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  local_auth: ^2.3.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
